# 工具下载 —— nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 站点本体是静态文件，另把 /api/ 反向代理到 EasyUpdate 服务。
# 同源代理是本方案的关键：IE6 的 XMLHttpRequest 不能跨域，代理之后
# 页面、接口、APK 下载全部同源，前端不需要任何跨域技巧，
# 下载按钮也可以直接写相对路径。

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # text/html is compressed by default and must not be listed again
    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css text/plain application/javascript application/json;

    # 整站只有几十 KB，且仍在迭代：一律要求重新校验，重新发布后立刻可见。
    # nginx 照常按 ETag / Last-Modified 回 304，未变动的资源不会重复传输。
    # 早先这里给 gif/ico 配过 30 天缓存，结果换了图标的 favicon.ico 会被
    # 浏览器留住一个月，不要再往回加。
    expires -1;

    # EasyUpdate 公开接口与 APK 下载
    # {{EU_UPSTREAM}} 由 tools/deploy.py 在部署时用 deploy.env 里的 EU_UPSTREAM 替换
    location /api/ {
        proxy_pass         http://{{EU_UPSTREAM}};
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;

        # APK 单文件可达 40 MB 以上：不落盘缓冲，边收边发
        proxy_buffering    off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        gzip off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
